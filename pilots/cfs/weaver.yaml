# Weaver pilot on NASA cFS v7.0.1 (see pilots/cfs/README.md).
# Installed at the top of the cFS checkout by pilots/cfs/setup.sh.
schema: weaver.project/1

project:
  name: cfs-pilot
  root: .
  # Validation workspaces copy the source tree; build trees and the ground system stay behind.
  # Generated headers in build-weaver/ are still read from the original tree.
  workspace_exclude: [.git, build-weaver, build-val, cFS-GroundSystem]

preservation:
  behaviors: [outputs, persistent-state, side-effect-ordering, event-messages, telemetry]
  # cFS apps each run in their own OSAL task and share data through the software bus and tables.
  # The threads of control of cpu1 are declared here and checked by Weaver ('weaver tasks'):
  # every thread the code starts must be declared, and a refactor that moves a read or write
  # across a call needs every other task to leave the object alone.  See pilots/cfs/README.md.
  concurrency:
    model: tasks
    programs: [cpu1]                  # the host tools start no thread; Weaver checks that too
    tasks:                            # one instance each unless 'instances: many'
      - {name: startup, entry: [main, CFE_Assert_LibInit, SAMPLE_LIB_Init]}  # ES start-up, library init, idle loop
      - {name: CFE_ES, entry: CFE_ES_TaskMain}
      - {name: CFE_EVS, entry: CFE_EVS_TaskMain}
      - {name: CFE_SB, entry: CFE_SB_TaskMain}
      - {name: CFE_TBL, entry: CFE_TBL_TaskMain}
      - {name: CFE_TIME, entry: CFE_TIME_TaskMain}
      - {name: CFE_TIME_TONE, entry: CFE_TIME_Tone1HzTask}
      - {name: CFE_TIME_1HZ, entry: CFE_TIME_Local1HzTask}
      - {name: CFE_ES_BACKGROUND, entry: CFE_ES_BackgroundTask}
      - {name: SAMPLE_APP, entry: SAMPLE_APP_Main}
      - {name: OS_TIMEBASE, entry: OS_TimeBasePthreadEntry, instances: many}   # one thread per time base
      - {name: OS_CONSOLE, entry: OS_ConsoleTask_Entry}
      - {name: PSP_SYSMON, entry: linux_sysmon_Task}
    interrupts:
      - {name: SIGHUP, entry: OS_NoopSigHandler}
      - {name: PSP_EXCEPTION, entry: [CFE_PSP_ExceptionSigHandler, CFE_PSP_ExceptionSigHandlerSuspend]}
    # OSAL and ES start every task through these trampolines, which call the real entry through a pointer
    dispatchers: [OS_PthreadTaskEntry, CFE_ES_TaskEntryPoint]
    indirect_calls:                   # the three calls SVF cannot resolve, resolved from the source
      - {at: "cfe/modules/es/fsw/src/cfe_es_apps.c:1016", targets: [CFE_Assert_LibInit, SAMPLE_LIB_Init],
         reason: library init functions named in the startup script (found by symbol lookup)}
      - {at: "cfe/modules/time/fsw/src/cfe_time_tone.c:1329", targets: [],
         unless_called: [CFE_TIME_RegisterSynchCallback], reason: time-synch callbacks; no application registers one}
      - {at: "osal/src/os/posix/src/os-impl-idmap.c:171", targets: [OS_Posix_ReleaseTableMutex],
         reason: pthread_cleanup_pop runs the routine pushed at line 149}

acceptance:
  require: [compile, mechanical-recheck, testing]
  min_evidence: secondary-checked

flow:
  models: [builtin:cfs]

# What runs together in one address space.  The cFE ES loader (OS_ModuleLoad / OS_SymbolLookup)
# resolves exactly the entry points in pilot_defs' startup script by name; nothing else is looked
# up dynamically.  The host tools and the functional-test module (cfe_testcase.so) are separate.
programs:
  - name: cpu1
    images: [core-cpu1, cfe_assert.so, sample_lib.so, sample_app.so]
    entry_points: [main, CFE_Assert_LibInit, SAMPLE_LIB_Init, SAMPLE_APP_Main]

profiles:
  - id: native
    description: "cFS native simulation, pilot mission (cpu1: cFE, OSAL, PSP, sample_app, sample_lib)"
    compile_commands: .weaver/compdb/native/compile_commands.json
    capture:
      command: >-
        rm -rf build-weaver &&
        CC={cc} cmake -S cfe -B build-weaver -DMISSIONCONFIG=pilot -DSIMULATION=native
        -DCMAKE_BUILD_TYPE=debug -DCFE_EDS_ENABLED=OFF -DENABLE_UNIT_TESTS=FALSE > /dev/null &&
        make -C build-weaver -j4 mission-all
      tools: {cc: gcc}
    secondary_frontend: {compiler: clang}
    target: {architecture: x86_64, abi: sysv, endianness: little}
    platform: {runtime_mode: process, os: linux, osal: posix}
    validation:
      # Rebuild each workspace with unit tests enabled and run the whole CTest suite (cFE,
      # OSAL and PSP coverage tests plus the sample app's).  Results are compared test by
      # test: a test that passes on the unpatched tree must pass with the patch.  Some OSAL
      # functional tests (queues, timers, sockets) depend on the host and may fail on both.
      build:
        run: >-
          rm -rf build-val &&
          CC=gcc cmake -S cfe -B build-val -DMISSIONCONFIG=pilot -DSIMULATION=native
          -DCMAKE_BUILD_TYPE=debug -DCFE_EDS_ENABLED=OFF -DENABLE_UNIT_TESTS=TRUE > /dev/null &&
          make -C build-val -j4 mission-all > /dev/null
        timeout: 1800
      tests:
        - name: ctest
          run: "ctest --test-dir build-val/native/default_cpu1 -j4 --timeout 120"
          timeout: 1800
