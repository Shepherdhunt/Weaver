# Reviewed pointer-effect models for POSIX (IEEE Std 1003.1-2017) and glibc interfaces.
#
# Loaded by default after external_models.yaml.  Each entry follows the function's
# specification: `writes` lists the 0-based arguments whose pointed-to objects the call
# may modify; `calls_back: true` means the call may run program code (thread start
# routines, signal or cleanup handlers, atfork handlers, module constructors) whose
# effects Weaver cannot bound here, so any query through it stays unknown.
#
# Objects owned by the library (DIR streams, FILE buffers, static result buffers) are
# not program objects; a call writing only those is modelled as writing its handle
# argument where the handle is a program object, and nothing otherwise.
#
# `retains` lists pointer arguments the function keeps after it returns (absent: none).
#
# Concurrency is not modelled: another thread or a signal handler running while a
# call blocks is covered by the preservation contract's concurrency declaration.
schema: weaver.external-models/1
reviewed: "2026-09-23"
source: "POSIX.1-2017 function specifications; glibc 2.39 manual for GNU extensions"
functions:
