[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weaver"
version = "0.1.0"
description = "Compiler-assisted, evidence-driven incremental C pointer migration toward a pointer-free CLite program"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
flow = ["pysvf>=1.0.0.43"]
test = ["pytest>=7"]

[project.scripts]
weaver = "weaver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weaver = ["data/*", "data/models/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008", "B905"]
